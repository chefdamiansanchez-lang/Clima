name: Compilar DATCO Clima

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q -o datco-clima.zip -d proyecto

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk DatcoClima.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DatcoClima-APK
          path: DatcoClima.apk

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clima-${{ github.run_number }}
          name: DATCO Clima ${{ github.run_number }}
          files: DatcoClima.apk
